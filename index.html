<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: phone-width app shell centred on larger screens; sticky header, scrolling body, fixed bottom tab bar */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --fg:#15211c; --muted:#55645d; --line:#dfe5e1;
  --accent:#0b6b4d; --accent-fg:#ffffff; --accent-soft:#e3f1ea; --accent-ink:#0b4d38;
  --warn-bg:#fde7d6; --warn-fg:#8a3d0c; --wait-bg:#fff4c7; --wait-fg:#5c4600;
  --ghost:#e2e8e4; --stage:#dde3df; --new-bg:#e3ecfb; --new-fg:#1f4aa8; --bad:#b42318; --m-p:#2f6fd6; --m-c:#c97a0e; --m-f:#a8457f; --over:#c2410c;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18211d; --fg:#e4ece8; --muted:#9aaca4; --line:#2a3531;
  --accent:#3fbf86; --accent-fg:#06281b; --accent-soft:#1a2e25; --accent-ink:#8fe0bb;
  --warn-bg:#3a2414; --warn-fg:#f5b585; --wait-bg:#352d0f; --wait-fg:#f0d77a;
  --ghost:#222c28; --stage:#0a0f0d; --new-bg:#1b2a45; --new-fg:#a9c4f5; --bad:#f19a9a; --m-p:#7aa7f5; --m-c:#f0b25a; --m-f:#e08ac4; --over:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18211d; --fg:#e4ece8; --muted:#9aaca4; --line:#2a3531;
  --accent:#3fbf86; --accent-fg:#06281b; --accent-soft:#1a2e25; --accent-ink:#8fe0bb;
  --warn-bg:#3a2414; --warn-fg:#f5b585; --wait-bg:#352d0f; --wait-fg:#f0d77a;
  --ghost:#222c28; --stage:#0a0f0d; --new-bg:#1b2a45; --new-fg:#a9c4f5; --bad:#f19a9a; --m-p:#7aa7f5; --m-c:#f0b25a; --m-f:#e08ac4; --over:#fb923c; color-scheme:dark}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:56px;box-sizing:border-box}
header.top h1{flex:1;margin:0;font-family:var(--display);font-size:19px;font-weight:700;text-wrap:balance;min-width:0}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:active{background:var(--ghost)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap}
main{flex:1;padding:16px 16px 110px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.hero .eb{font-size:13px;opacity:.85}
.hero .tt{font-family:var(--display);font-size:22px;font-weight:700}
.hero .sb{font-size:14px;opacity:.92}
.hero .acts{display:flex;gap:8px;margin-top:8px}
.hero .acts button{flex:1;border-radius:12px;padding:12px 0;font-weight:600;border:1.5px solid currentColor;background:transparent;color:inherit}
.hero .acts button.p{background:var(--accent-fg);color:var(--accent);border-color:var(--accent-fg)}
.list{background:var(--surface);border-radius:16px;overflow:hidden}
.row{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;min-height:56px;box-sizing:border-box}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--ghost)}
.row .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;font-weight:600;font-size:13px}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .lb{font-weight:600}
.row .sb{font-size:12.5px;color:var(--muted)}
.row .chev{color:var(--muted);flex:none}
.badge{font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;white-space:nowrap}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)}
.b-wait{background:var(--wait-bg);color:var(--wait-fg)}
.b-ok{background:var(--accent-soft);color:var(--accent-ink)}
.b-new{background:var(--new-bg);color:var(--new-fg)}
.streak{border:0;background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.streak .hd{display:flex;align-items:center;gap:10px}
.streak .fl{width:40px;height:40px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);display:flex;align-items:center;justify-content:center;flex:none}
.streak .t{font-family:var(--display);font-weight:700;font-size:17px}
.streak .s{font-size:12.5px;color:var(--muted)}
.streak .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.streak .d{display:flex;flex-direction:column;align-items:center;gap:3px}
.streak .d i{width:22px;height:22px;border-radius:50%;background:var(--ghost);display:block}
.streak .d i.on{background:var(--accent)}
.macro{border:0;background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.macro .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.macro .hd .t{font-family:var(--display);font-weight:600;font-size:15px}
.macro .hd .s{font-size:12px;color:var(--muted)}
.mrow{display:flex;flex-direction:column;gap:5px}
.mrow .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.mrow .top b{font-weight:600}
.mrow .top span{color:var(--muted);font-variant-numeric:tabular-nums}
.mrow.cal .top{font-size:14px}
.mrow.cal .top .kc{font-family:var(--display);font-size:22px;font-weight:700;color:var(--fg)}
.bar{height:9px;border-radius:5px;background:var(--ghost);overflow:hidden}
.mrow.cal .bar{height:14px;border-radius:7px}
.bar i{display:block;height:100%;border-radius:inherit}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mrow .left{font-size:11.5px;color:var(--muted)}
.mrow .left.over{color:var(--over);font-weight:600}
.card2{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row2{display:flex;align-items:center;gap:12px}
.av2{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.h3{font-family:var(--display);font-weight:700;font-size:17px}
.muted2{font-size:13px;color:var(--muted)}
.kv2{display:grid;grid-template-columns:100px minmax(0,1fr);gap:6px 10px;margin:0;font-size:14px}
.kv2 dt{color:var(--muted)} .kv2 dd{margin:0}
.warnbox{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}
.sessbar{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.prog{display:flex;flex-direction:column;align-items:center;min-width:64px;background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:6px 10px}
.prog b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums} .prog span{font-size:11px}
.ex{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.ex.cur{border-color:var(--accent)}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.setrow.head{font-size:12px;color:var(--muted)}
.setrow .sn{font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.setrow input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;min-width:0}
.setrow input:focus{outline:none;border-color:var(--accent)}
.setrow.done input{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.chk{width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.exacts{display:flex;gap:8px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;min-height:36px}
.ta,.inp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--fg)}
.ta{min-height:72px;resize:vertical}
.sessfoot{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;padding-top:8px;background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.timer{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 14px;font-size:14px}
.timer b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;margin-right:auto}
.timer .mini{background:transparent;color:var(--bg);border-color:currentColor}
.cta:disabled{opacity:.45}
.bignum{display:flex;align-items:center;gap:14px}
.bignum b{font-family:var(--display);font-size:64px;line-height:1;font-weight:700;color:var(--accent)}
.bignum span{font-size:14px;color:var(--muted);line-height:1.35}
.pbar{height:10px;border-radius:5px;background:var(--ghost);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.dayrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;min-height:56px}
.day b{font-family:var(--display);font-size:18px}
.day small{font-size:9.5px;color:var(--muted)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day:disabled{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-variant-numeric:tabular-nums;font-weight:600;display:flex;flex-direction:column;align-items:center;min-height:48px}
.slot small{font-size:10px;font-weight:400;color:var(--muted)}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.slot:disabled{opacity:.4;text-decoration:line-through}
.scrim2{position:fixed;inset:0;background:rgba(8,14,11,.45);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;box-sizing:border-box;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow-y:auto}
.sheet h2{margin:0;font-family:var(--display);font-size:20px}
.row.sel{background:var(--accent-soft)}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.chip2{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px}
.chip2.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tm-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.num{font-variant-numeric:tabular-nums}
.customtime{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.customtime .inp{font-size:18px;font-variant-numeric:tabular-nums}
.ghostbtn.danger{color:var(--bad);border-color:currentColor}
.cta.danger{background:#b42318;color:#ffffff}
.mcard{background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mtop{display:flex;justify-content:space-between;width:100%;font-size:13px;gap:8px}
.qrbox{background:#ffffff;border-radius:16px;padding:12px;line-height:0}
.mname{font-family:var(--display);font-size:22px;font-weight:700}
.mmeta{font-size:13px;opacity:.9}
.flag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 8px;background:var(--new-bg);color:var(--new-fg)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:0;background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile.warn{background:var(--warn-bg);color:var(--warn-fg)}
.tile.warn .l{color:var(--warn-fg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big{border:0;background:var(--surface);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;font-weight:600}
.big.p{background:var(--accent);color:var(--accent-fg)}
.big svg{width:26px;height:26px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--surface);border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;color:var(--muted);min-height:60px}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.empty{background:var(--surface);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty .box{width:64px;height:64px;border-radius:18px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty h2{margin:0;font-family:var(--display);font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:32ch}
.spec{background:var(--surface);border-radius:16px;padding:14px 16px}
.spec h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.spec ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:4px}
.cta{border:0;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:14px;font-weight:600;width:100%}
.ghostbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:600;width:100%}
.brand{padding:40px 8px 8px;display:flex;flex-direction:column;gap:6px}
.brand .logo{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.brand h1{margin:8px 0 0;font-family:var(--display);font-size:32px;font-weight:700}
.brand p{margin:0;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);text-align:center}
.crumb{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){main{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div id="app"></div>

function itemHTML(it){
  if(it.type==='hero') return `<div class="hero"><div class="eb">${esc(it.eb)}</div><div class="tt">${esc(it.tt)}</div><div class="sb">${esc(it.sb)}</div><div class="acts">${it.acts.map(a=>`<button class="${a.p?'p':''}" data-to="${a.to}">${esc(a.label)}</button>`).join('')}</div></div>`;
  if(it.type==='tiles') return `<div class="tiles" style="grid-template-columns:repeat(${it.items.length===3?3:2},minmax(0,1fr))">${it.items.map(t=>`<button class="tile ${t.warn?'warn':''}" data-to="${t.to}"><span class="l">${esc(t.l)}</span><span class="v">${esc(t.v)}</span></button>`).join('')}</div>`;
  if(it.type==='big2'||it.type==='big3') return `<div class="grid2" style="grid-template-columns:repeat(${it.items.length},minmax(0,1fr))">${it.items.map(b=>`<button class="big ${b.p?'p':''}" data-to="${b.to}">${svg(b.icon)}<span>${esc(b.label)}</span></button>`).join('')}</div>`;
  if(it.type==='parts') return `<div class="grid2" style="grid-template-columns:repeat(4,minmax(0,1fr))">${PARTS.map(p=>`<button class="big" style="min-height:64px;align-items:center;justify-content:center" data-to="${it.to}"><span>${esc(p[0])}</span></button>`).join('')}</div>`;
  if(it.type==='streak'){
    const d=['จ','อ','พ','พฤ','ศ','ส','อา'], on=[1,1,1,1,1,1,0];
    return `<button class="streak" data-to="${it.to}"><span class="hd"><span class="fl">${svg('fire')}</span><span style="display:flex;flex-direction:column"><span class="t">ออกกำลังต่อเนื่อง 6 วัน</span><span class="s">อีก 1 วัน ได้เหรียญ "สัปดาห์เต็ม" · ตัวอย่าง</span></span><span class="flag" style="margin-left:auto">ข้อเสนอ</span></span><span class="days">${d.map((x,i)=>`<span class="d"><i class="${on[i]?'on':''}"></i>${x}</span>`).join('')}</span></button>`;
  }
  if(it.type==='macro'){
    const fmt=n=>n.toLocaleString('en-US');
    const left=(v,t,u)=>v>t?`<span class="left over">เกิน ${fmt(v-t)} ${u}</span>`:`<span class="left">เหลือ ${fmt(t-v)} ${u}</span>`;
    const bar=(v,t,col)=>`<span class="bar" role="progressbar" aria-valuenow="${v}" aria-valuemax="${t}"><i style="width:${Math.min(100,Math.round(v/t*100))}%;background:${v>t?'var(--over)':col}"></i></span>`;
    const m=(lb,a,col)=>`<span class="mrow"><span class="top"><b>${lb}</b><span>${fmt(a[0])}/${fmt(a[1])}</span></span>${bar(a[0],a[1],col)}${left(a[0],a[1],'ก.')}</span>`;
    return `<button class="macro" data-to="${it.to}"><span class="hd"><span class="t">วันนี้กินไปแล้ว</span><span class="s">${esc(it.note)}</span></span>
      <span class="mrow cal"><span class="top"><b>แคลอรี</b><span><span class="kc">${fmt(it.cal[0])}</span> / ${fmt(it.cal[1])} kcal</span></span>${bar(it.cal[0],it.cal[1],'var(--accent)')}${left(it.cal[0],it.cal[1],'kcal')}</span>
      <span class="mgrid">${m('โปรตีน',it.p,'var(--m-p)')}${m('คาร์บ',it.c,'var(--m-c)')}${m('ไขมัน',it.f,'var(--m-f)')}</span></button>`;
  }
  if(it.type==='note') return `<p class="note" style="margin:0">${esc(it.text)}</p>`;
  return '';
}
function rowHTML(r){
  const ic = r.icon ? `<span class="ic">${svg(r.icon,20)}</span>` : `<span class="ic">${esc(r.ic||'')}</span>`;
  const badge = r.badge ? `<span class="badge b-${r.badge[1]}">${esc(r.badge[0])}</span>` : (r.nw ? `<span class="badge b-new">ข้อเสนอ</span>` : '');
  return `<button class="row" data-to="${r.to}">${ic}<span class="tx"><span class="lb">${esc(r.lb)}</span>${r.sb?`<span class="sb">${esc(r.sb)}</span>`:''}</span>${badge}<span class="chev">${svg('chev',18)}</span></button>`;
}
function sectionsHTML(secs){
  return secs.map(s=>{
    const rows = s.items.filter(i=>i.type==='row');
    const others = s.items.filter(i=>i.type!=='row');
    return `<section class="sec">${s.title?`<h2>${esc(s.title)}</h2>`:''}${others.map(itemHTML).join('')}${rows.length?`<div class="list">${rows.map(rowHTML).join('')}</div>`:''}</section>`;
  }).join('');
}

}

const RS_BUSY={0:['07:00','10:00','13:00','19:00'],1:[],2:['08:00','18:00'],3:['07:00','17:00','18:00']};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function rsConflict(sel){
  if(!sel.time) return '';
  const t=toMin(sel.time);
  if(t<toMin('06:00')||t>toMin('21:00')) return 'นอกเวลาเปิดยิม (06:00–22:00)';
  const hit=(RS_BUSY[sel.day]||[]).find(b=>Math.abs(toMin(b)-t)<60);
  return hit?`ชนกับนัด ${hit}–${String(+hit.slice(0,2)+1).padStart(2,'0')}:${hit.slice(3)} · เลือกเวลาอื่น`:'';
}

function qrSVG(seed){
  /* decorative QR-like pattern for the prototype — not a scannable code */
  let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
  const n=21,cells=[];const rnd=()=>{s=(s*1103515245+12345)>>>0;return (s>>>16)&1};
  const finder=(x,y)=>{const r=[];for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>1&&i<5&&j>1&&j<5);if(e)r.push([x+i,y+j]);}return r;};
  const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
  for(let x=0;x<n;x++)for(let y=0;y<n;y++){if(!inF(x,y)&&rnd())cells.push([x,y]);}
  const all=cells.concat(finder(0,0),finder(14,0),finder(0,14));
  return `<svg viewBox="-1 -1 23 23" width="190" height="190" role="img" aria-label="QR บัตรสมาชิก (ตัวอย่าง)"><rect x="-1" y="-1" width="23" height="23" fill="#ffffff"/>${all.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="#15211c"/>`).join('')}</svg>`;
}

    <button class="cta" data-act="addpkgok" ${s.pick==null?'disabled':''}>เพิ่มแพ็ก</button><button class="ghostbtn" data-act="closesheet">ยกเลิก</button>`;}
  if(s.k==='editpkg'){const c=T.clients[T.cc];body=`<h2>แก้ไขแพ็ก</h2>
    <p class="muted2">ต่อวันหมดอายุ (ตอนนี้ ${dTh(dParse(c.pkg.end))})</p><div class="chips2">${[['+7 วัน',7],['+14 วัน',14],['+1 เดือน',30]].map(x=>`<button class="chip2 ${s.days===x[1]?'on':''}" data-act="eday" data-n="${x[1]}">${x[0]}</button>`).join('')}</div>
    <p class="muted2">ปรับจำนวนครั้ง (ตอนนี้เหลือ ${left(c)})</p><div class="chips2">${[['−1 ครั้ง',-1],['+1 ครั้ง (แถม)',1],['+2 ครั้ง',2]].map(x=>`<button class="chip2 ${s.n===x[1]?'on':''}" data-act="ecnt" data-n="${x[1]}">${x[0]}</button>`).join('')}</div>
    <label class="muted2" for="eReason">เหตุผล (จำเป็น)</label><input id="eReason" class="inp" data-in="reason" value="${esc(s.reason||'')}" placeholder="เช่น ลูกเทรนป่วย ขอต่อเวลา">
    <button class="cta" data-act="editok" ${(s.days||s.n)&&(s.reason||'').trim()?'':'disabled'}>บันทึกการแก้ไข</button><button class="ghostbtn" data-act="closesheet">ยกเลิก</button>`;}
  if(s.k==='rmclient'){const c=T.clients[T.cc],l=left(c),fut=T.appts.filter(a=>a.c===T.cc&&(a.status==='todo'||a.status==='req')).length;body=`<h2>ลบ ${esc(c.name)} ออกจากรายชื่อ?</h2>
    <ul class="muted2" style="margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:4px"><li>หายจากรายชื่อและตารางของคุณ</li><li>โน้ต โปรแกรม และข้อมูลที่คุณเก็บไว้ ถูกลบจากฝั่งคุณ</li><li>บัญชีของลูกเทรนยังอยู่ปกติ ประวัติการเทรนยังอยู่ในแอปของเขา</li><li>อยากกลับมาดูแลอีก เชิญใหม่ได้ด้วย UID / QR</li>${fut?`<li>นัดที่ยังไม่ถึง ${fut} นัด จะถูกยกเลิก และแจ้งลูกเทรน</li>`:''}</ul>
    ${l>0?`<div class="warnbox">แพ็กยังเหลือ ${l} ครั้ง · ถ้าอยู่ในยิม แพ็กจะกลับไปให้เจ้าของยิมจัดการต่อ (ย้ายเทรนเนอร์ / คืนเงิน)</div>`:''}
    <button class="cta danger" data-act="rmok">ลบออกจากรายชื่อ</button><button class="ghostbtn" data-act="closesheet">ยกเลิก</button>`;}
  if(s.k==='addex'){const lib=['Leg Press','Leg Extension','Calf Raise','Bulgarian Split Squat','Glute Kickback','Hip Abduction'];body=`<h2>เพิ่มท่า (คลังท่า · ขา)</h2><div class="list">${lib.map(n=>`<button class="row" data-act="addexok" data-n="${n}"><span class="tx"><span class="lb">${n}</span></span><span class="chev">+</span></button>`).join('')}</div><button class="ghostbtn" data-act="closesheet">ปิด</button>`;}
  return `<div class="scrim2" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true">${body}</div>`;
}

function onAct(b){
  const A=b.dataset.act, a=b.dataset.id?apptOf(b.dataset.id):null;
  const S2=T.sheet;
  switch(A){
    case 'appt': T.cur=a.id; if(a.status==='req'){return go('requests');} if(a.status==='live'){return go('session');} return go('appt_detail');
    case 'start': T.cur=a.id; if(!T.sess||T.sess.appt!==a.id){T.sess=newSession(a);} a.status='live'; return go('session');
    case 'resched': T.cur=a.id; T.rs={day:0,time:null}; return go('reschedule');
    case 'noshow': T.sheet={k:'noshow',id:a.id}; return render();
    case 'cancel': T.sheet={k:'cancel',id:a.id}; return render();
    case 'pkg': T.cc=b.dataset.c; return go('c_package');
    case 'tick':{const x=T.sess.ex[b.dataset.e].sets[b.dataset.s]; x.done=!x.done; if(x.done) startRest(90); else {clearInterval(T.timer);T.timer=null;} return render();}
    case 'addset':{const e=T.sess.ex[b.dataset.e],l=e.sets[e.sets.length-1]; e.sets.push({w:l.w,r:l.r,done:false}); return render();}
    case 'delset': T.sess.ex[b.dataset.e].sets.pop(); return render();
    case 'skiprest': clearInterval(T.timer); T.timer=null; return render();
    case 'plus30': T.timerLeft+=30; return;
    case 'addex': T.sheet={k:'addex'}; return render();
    case 'addexok': T.sess.ex.push({n:b.dataset.n,prev:'ยังไม่เคยเล่น',sets:[{w:20,r:12,done:false},{w:20,r:12,done:false},{w:20,r:12,done:false}]}); T.sheet=null; toast(`เพิ่ม ${b.dataset.n} แล้ว`); return render();
    case 'finish': T.sheet={k:'finish'}; return render();
    case 'finishok':{const ap=apptOf(T.sess.appt),c=cl(ap);c.pkg.used++;ap.status='done';c.log.unshift({d:dTh(D0),t:`ใช้ 1 ครั้ง · ${PROG[ap.prog].name}`,k:'use'});if(T.hist[ap.c])T.hist[ap.c].unshift({d:dTh(D0),prog:PROG[ap.prog].name,by:'เทรนเนอร์ต้น',dur:'60 นาที',ex:T.sess.ex.filter(e=>e.sets.some(x=>x.done)).map(e=>{const d=e.sets.filter(x=>x.done);return [e.n,`${d.length} × ${d[0].r} @ ${d[d.length-1].w} กก.`]}),note:T.sess.note});clearInterval(T.timer);T.timer=null;T.sess=null;T.sheet=null;stack=['t_today'];toast(`จบเซสชัน · ${c.name} เหลือ ${left(c)} ครั้ง`);render();return window.scrollTo(0,0);}
    case 'nsok':{const ap=apptOf(S2.id),c=cl(ap);ap.status='noshow';if(b.dataset.cut==='1'){c.pkg.used++;c.log.unshift({d:dTh(D0),t:'ขาดนัด · ตัด 1 ครั้ง ตามนโยบาย',k:'use'});}T.sheet=null;stack=['t_today'];toast(b.dataset.cut==='1'?'บันทึกขาดนัด · ตัด 1 ครั้ง':'บันทึกขาดนัด · ไม่ตัดครั้ง');return render();}
    case 'cancelok':{apptOf(b.dataset.id).status='cancel';T.sheet=null;stack=['t_today'];toast('ยกเลิกนัดแล้ว · แจ้งลูกเทรนแล้ว');return render();}
    case 'rsday': T.rs={day:+b.dataset.i,time:null,custom:T.rs.custom}; return render();
    case 'rstime': T.rs.time=b.dataset.t; T.rs.custom=false; return render();
    case 'rscustom': T.rs.custom=true; T.rs.time=null; render(); {const el=document.getElementById('rsTime'); if(el) el.focus();} return;
    case 'rsok':{const ap=apptOf(T.cur),d=dAdd(D0,T.rs.day);if(T.rs.day===0){ap.time=T.rs.time;T.appts.sort((x,y)=>x.time.localeCompare(y.time));}else{ap.status='moved';ap.moved=`${TH_DOW[d.getDay()]} ${dTh(d)} ${T.rs.time}`;}stack=['t_today'];toast(`เลื่อนเป็น ${TH_DOW[d.getDay()]} ${dTh(d)} ${T.rs.time} · แจ้งลูกเทรนแล้ว`);return render();}
    case 'rqok':{const d=dAdd(D0,a.req.day);a.status='moved';a.moved=`${TH_DOW[d.getDay()]} ${dTh(d)} ${a.req.time}`;toast('อนุมัติแล้ว · แจ้งลูกเทรนแล้ว');stack=['t_today'];return render();}
    case 'rqno': a.status='todo'; toast('ปฏิเสธแล้ว · คงนัดเดิม'); stack=['t_today']; return render();
    case 'rqother': a.status='todo'; T.cur=a.id; T.rs={day:a.req.day,time:null}; stack=['t_today','reschedule']; return render();
    case 'addpkg': T.sheet={k:'addpkg',pick:null}; return render();
    case 'pkpick': T.sheet.pick=+b.dataset.i; return render();
    case 'addpkgok':{const c=T.clients[T.cc],p=T.prices[S2.pick],rem=left(c);c.pkg={label:`${p.n} ครั้ง / ${p.months} เดือน`,total:p.n+rem,used:0,end:dIso(new Date(D0.getFullYear(),D0.getMonth()+p.months,D0.getDate()))};c.log.unshift({d:dTh(D0),t:`เพิ่มแพ็ก ${p.n} ครั้ง (฿${p.price.toLocaleString('en-US')}) + ยกยอดเดิม ${rem} ครั้ง · โดย ต้น`,k:'add'});T.sheet=null;toast(`เพิ่มแพ็กแล้ว · เหลือ ${left(c)} ครั้ง`);return render();}
    case 'editpkg': T.sheet={k:'editpkg',days:0,n:0,reason:''}; return render();
    case 'eday': S2.days=S2.days===+b.dataset.n?0:+b.dataset.n; return render();
    case 'ecnt': S2.n=S2.n===+b.dataset.n?0:+b.dataset.n; return render();
    case 'editok':{const c=T.clients[T.cc],parts=[];if(S2.days){c.pkg.end=dIso(dAdd(dParse(c.pkg.end)<D0?D0:dParse(c.pkg.end),S2.days));parts.push(`ต่ออายุ +${S2.days} วัน`);}if(S2.n){c.pkg.total+=S2.n;parts.push(`${S2.n>0?'+':''}${S2.n} ครั้ง`);}c.log.unshift({d:dTh(D0),t:`แก้ไข: ${parts.join(', ')} · เหตุผล: ${S2.reason.trim()} · โดย ต้น`,k:'edit'});T.sheet=null;toast('บันทึกการแก้ไขแล้ว');return render();}
    case 'client': T.cc=b.dataset.c; return go('t_client');
    case 'rmclient': T.sheet={k:'rmclient'}; return render();
    case 'rmok':{const c=T.clients[T.cc];c.removed=true;T.appts.forEach(a=>{if(a.c===T.cc&&(a.status==='todo'||a.status==='req'))a.status='cancel';});T.appts=T.appts.filter(a=>a.c!==T.cc);T.sheet=null;stack=['t_clients'];toast(`ลบ ${c.name} ออกจากรายชื่อแล้ว`);return render();}
    case 'cancelreq':{const a2=myAppt();if(a2&&a2.status==='req'){a2.status='todo';delete a2.req;}toast('ยกเลิกคำขอแล้ว · นัดเดิมยังอยู่');stack=['u_home_c'];return render();}
    case 'hist': T.hi=+b.dataset.i; return go('hist_detail');
    case 'crsday': T.crs={day:+b.dataset.i,time:null,why:T.crs.why}; return render();
    case 'crstime': T.crs.time=b.dataset.t; return render();
    case 'crsok':{const a2=myAppt();a2.status='req';a2.req={day:T.crs.day,time:T.crs.time,why:T.crs.why};T.crs=null;stack=['u_home_c'];toast('ส่งคำขอแล้ว · รอเทรนเนอร์ต้นตอบ');return render();}
    case 'contact': toast('ต้นแบบ: จะเปิด LINE / โทรออกในแอปจริง'); return;
    case 'closesheet': T.sheet=null; return render();
  }
}
function onInput(el){
  const k=el.dataset.in;
  if(k==='w'||k==='r'){T.sess.ex[el.dataset.e].sets[el.dataset.s][k]=el.value;return;}
  if(k==='note'){T.sess.note=el.value;return;}
  if(k==='crswhy'&&T.crs){T.crs.why=el.value;return;}
  if(k==='rstime'){T.rs.time=el.value||null;const d=dAdd(D0,T.rs.day),warn=rsConflict(T.rs),ok=document.getElementById('rsOk'),w=document.getElementById('rsWarn');
    if(w){w.textContent=warn||(T.rs.time?'ว่าง · ใช้เวลานี้ได้':'นัด 1 ชั่วโมง · ระบบเช็กว่าชนกับนัดอื่นไหม');w.style.color=warn?'var(--warn-fg)':'';}
    if(ok){ok.disabled=!T.rs.time||!!warn;ok.textContent='ยืนยันเลื่อน'+(T.rs.time?` เป็น ${TH_DOW[d.getDay()]} ${dTh(d)} ${T.rs.time}`:'');}return;}
  if(k==='reason'&&T.sheet){T.sheet.reason=el.value;const ok=document.querySelector('[data-act="editok"]');if(ok)ok.disabled=!((T.sheet.days||T.sheet.n)&&el.value.trim());}
}

function renderScreen(){
  const id = stack[stack.length-1];
  const r = ROLES[role];
  const cs = C[id];
  const scr = S[id], pg = P[id] || {title:id,spec:['(ยังไม่ได้กำหนด)']};
  const title = cs ? cs.title : scr ? scr.title : pg.title;
  const canBack = stack.length>1;
  const body = cs ? cs.render() : scr ? sectionsHTML(scr.sections) :
    emptyHTML(pg, `${id==='logout'?`<button class="cta" data-home="1">ออกจากระบบ (กลับหน้าแรก)</button>`:''}<button class="ghostbtn" data-back="1">กลับ</button>`);
  app.innerHTML = `
    <header class="top">
      ${canBack?`<button class="iconbtn" data-back="1" aria-label="กลับ">${svg('back')}</button>`:`<span style="width:4px"></span>`}
      <h1>${esc(title)}</h1>
      <button class="chip" data-home="1" aria-label="สลับบทบาท">${esc(r.name)} ▾</button>
    </header>
    <main>${body}</main>
    <nav class="tabs" style="grid-template-columns:repeat(${r.tabs.length},minmax(0,1fr))">
      ${r.tabs.map(t=>{const on = stack[0]===t[0]; return `<button class="${on?'on':''}" data-tab="${t[0]}" ${on?'aria-current="page"':''}>${svg(t[2])}<span>${esc(t[1])}</span></button>`}).join('')}
    </nav>${sheetHTML()}`;
}

function renderAuthPage(){
  const id = stack[stack.length-1], pg = P[id];
  app.innerHTML = `<header class="top"><button class="iconbtn" data-home="1" aria-label="กลับ">${svg('back')}</button><h1>${esc(pg.title)}</h1></header>
    <main style="padding-bottom:32px">${emptyHTML(pg,'<button class="ghostbtn" data-home="1">กลับหน้าแรก</button>')}</main>`;
}

function render(){
  if(!role && stack.length) renderAuthPage();
  else if(!role) renderStart();
  else renderScreen();
}

app.addEventListener('input', e=>{ if(e.target.dataset && e.target.dataset.in) onInput(e.target); });
app.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-act]'); if(!b) return;
  if(b.dataset.act) return onAct(b);
  if(b.dataset.role) return start(b.dataset.role);
  if(b.dataset.home) return home();
  if(b.dataset.back) return back();
  if(b.dataset.tab) return tab(b.dataset.tab);
  if(b.dataset.to){
    const to = b.dataset.to;
    if(role && ROLES[role].tabs.some(x=>x[0]===to)) return tab(to);
    return go(to);
  }
});

/* expose for link checks */
window.__TM = {S,P,ROLES};
render();
})();

</script>
