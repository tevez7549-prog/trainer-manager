name: responsive-check
on:
  push:
    paths: ['app/**', '.github/workflows/responsive.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx expo export -p web > build.log 2>&1 || (tail -40 build.log; exit 1)
      - name: Check every screen at phone widths
        run: |
          npm i --no-save playwright@1.48.2 serve@14.2.4 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          (npx serve -s dist -l 4000 > /dev/null 2>&1 &) ; sleep 3
          node scripts/responsive.mjs /tmp/screens > /dev/null 2>&1 || true
          grep -c '^WIDE' /tmp/screens/report.txt || true
          echo "::notice title=responsive::$(grep -v '^ok' /tmp/screens/report.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      # Screenshots go to their own branch so they can be looked at without downloading artifacts
      - name: Publish screenshots
        run: |
          cd /tmp/screens
          git init -q -b screens && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "screens ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens
