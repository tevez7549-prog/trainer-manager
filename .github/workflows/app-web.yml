name: app-web-build
on:
  push:
    paths: ['app/**', '.github/workflows/app-web.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Check Expo package versions
        run: npx expo install --check || true
      - name: Type check
        run: npx tsc --noEmit || true
      - name: Build web
        run: npx expo export -p web
      - run: ls -la dist && test -f dist/_redirects
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: app/dist }
