name: app-web-build
on:
  push:
    paths: ['app/**', '.github/workflows/app-web.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      # Each step reports its last lines as an annotation so the log can be read through the API
      - name: Check Expo package versions
        run: |
          npx expo install --check > check.log 2>&1 || true
          echo "::notice title=expo-check::$(tail -25 check.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - name: Type check
        run: |
          npx tsc --noEmit > tsc.log 2>&1 && echo "::notice title=tsc::ok" || echo "::warning title=tsc::$(head -40 tsc.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - name: Build web
        run: |
          set -o pipefail
          if ! npx expo export -p web > build.log 2>&1; then
            echo "::error title=build::$(tail -60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; fi
          echo "::notice title=build::$(tail -15 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - run: ls -la dist && test -f dist/_redirects
      - name: Smoke test
        run: |
          npm i --no-save playwright@1.48.2 serve@14.2.4 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          (npx serve -s dist -l 4000 > /dev/null 2>&1 &) ; sleep 3
          node scripts/smoke.mjs > smoke.log 2>&1 || true
          echo "::notice title=smoke::$(cat smoke.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: app/dist }
